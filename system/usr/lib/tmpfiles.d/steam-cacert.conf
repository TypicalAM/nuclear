# /usr/lib/tmpfiles.d/steam-cacert.conf
# Steam bundles its own OpenSSL that hardcodes the Debian cert-bundle path
# /etc/ssl/certs/ca-certificates.crt, which Fedora never ships. Without it
# Steam fails with "unable to load trusted SSL root certificates" and gets
# stuck at "logging you in".
#
# We can't just ship the symlink as a static file: /etc/ssl/certs is a symlink
# to /etc/pki/tls/certs, whose contents are regenerated wholesale by
# `update-ca-trust extract` on every deployment, which drops any file we added.
# systemd-tmpfiles recreates the symlink on every boot, so it survives.
# See tmpfiles.d(5).
L /etc/ssl/certs/ca-certificates.crt - - - - /etc/pki/ca-trust/extracted/pem/tls-ca-bundle.pem
