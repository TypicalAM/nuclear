name: Build image
run-name: Build image

on:
  workflow_dispatch:
  push:
    branches:
      - 'main'
    paths-ignore:
      - '**/*.md'
      - '*.md'
  schedule:
    - cron: '30 13 * * FRI'    # Triggers Fri at 13:30

# Nothing is writable unless a job asks for it
permissions: {}

env:
  IMAGE_REGISTRY: docker.piaseczny.dev
  IMAGE_NAME: machine/nuclear

# Never let two runs race to push the same tags
concurrency:
  group: build-image
  cancel-in-progress: false

jobs:
  io-image:
    runs-on: ubuntu-26.04
    # Holds the Secure Boot and cosign keys; restricted to the main branch in the repo settings
    environment: signing
    permissions:
      contents: read
      id-token: write       # build provenance attestation
      attestations: write
    steps:
    - name: Maximize build space
      run: |
        df -h /
        # Plain directory removal instead of apt, so it works on any runner image
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache \
          /usr/local/share/boost /usr/local/julia* /usr/share/swift /opt/microsoft /opt/az \
          /usr/local/.ghcup /usr/lib/jvm
        docker system prune -af >/dev/null || true
        df -h /

    - name: Mount BTRFS for podman storage
      id: container-storage-action
      # renovate: datasource=git-refs depName=https://github.com/ublue-os/container-storage-action currentValue=main
      uses: ublue-os/container-storage-action@dc1f4c8f17b672069e921f001132f7cf98a423a6
      continue-on-error: true
      with:
        target-dir: /var/lib/containers
        mount-opts: compress-force=zstd:2

    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        persist-credentials: false

    - name: Install cosign
      uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      with:
        # v2 keeps the signature layout (sha256-<digest>.sig tags) that containers/image
        # on the host reads with use-sigstore-attachments
        cosign-release: v2.6.5

    - name: Podman login
      env:
        REGISTRY_USERNAME: ${{ secrets.REGISTRY_USER }}
        REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASS }}
      run: |
        # One auth file for podman, cosign and syft
        mkdir -p ~/.docker
        echo "$REGISTRY_PASSWORD" | podman login "$IMAGE_REGISTRY" \
          --username "$REGISTRY_USERNAME" \
          --password-stdin \
          --authfile ~/.docker/config.json

    - name: Write Secure Boot key to file
      run: |
        install -m 600 /dev/null sb.key
        printf '%s' "$SB_PRIVATE_KEY" > sb.key
      env:
        SB_PRIVATE_KEY: ${{ secrets.SB_PRIVATE_KEY }}

    - name: Build base image
      run: podman build --secret id=sb-key,src=sb.key -t "$IMAGE_REGISTRY/$IMAGE_NAME:latest" --target base .

    - name: Build NVIDIA image
      run: podman build --secret id=sb-key,src=sb.key -t "$IMAGE_REGISTRY/$IMAGE_NAME:nvidia" --target nvidia .

    - name: Remove Secure Boot key
      if: always()
      run: shred -u sb.key || rm -f sb.key

    - name: Push base image
      id: push-base
      run: podman push --authfile ~/.docker/config.json --digestfile base.digest "$IMAGE_REGISTRY/$IMAGE_NAME:latest"

    - name: Push NVIDIA image
      id: push-nvidia
      run: podman push --authfile ~/.docker/config.json --digestfile nvidia.digest "$IMAGE_REGISTRY/$IMAGE_NAME:nvidia"

    - name: Read digests
      id: digest
      run: |
        echo "base=$(cat base.digest)" >> "$GITHUB_OUTPUT"
        echo "nvidia=$(cat nvidia.digest)" >> "$GITHUB_OUTPUT"

    # Signatures and attestations are added after the push, by digest, so they bind to exactly
    # what the registry holds. The host verifies the key-based signature; the keyless one (Fulcio cert + Rekor entry,
    # bound to this workflow's identity) lets anyone else verify provenance.
    - name: Sign images
      env:
        COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
        COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        BASE_DIGEST: ${{ steps.digest.outputs.base }}
        NVIDIA_DIGEST: ${{ steps.digest.outputs.nvidia }}
      run: |
        for d in "$BASE_DIGEST" "$NVIDIA_DIGEST"; do
          cosign sign --yes --key env://COSIGN_PRIVATE_KEY \
            --registry-referrers-mode legacy \
            "$IMAGE_REGISTRY/$IMAGE_NAME@$d"
        done

    - name: Sign images (keyless, public Rekor log)
      env:
        BASE_DIGEST: ${{ steps.digest.outputs.base }}
        NVIDIA_DIGEST: ${{ steps.digest.outputs.nvidia }}
      run: |
        for d in "$BASE_DIGEST" "$NVIDIA_DIGEST"; do
          cosign sign --yes --registry-referrers-mode legacy \
            "$IMAGE_REGISTRY/$IMAGE_NAME@$d"
        done

    # SBOM and provenance come after the images are pushed and signed, and none of them may
    # fail or hold up the build. SBOMs are generated from the images already in local storage
    # (an uncompressed export), not by pulling the multi-GB images back from the registry.
    # Only the RPM database is cataloged: the other 33 syft catalogers walk every file in the
    # image and took ~6.5 min per image. Pinned release binaries are listed in build-ctx.
    - name: Install syft
      id: syft
      continue-on-error: true
      uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
      with:
        syft-version: v1.57.0

    - name: Generate SBOMs
      id: sbom
      if: steps.syft.outcome == 'success'
      continue-on-error: true
      timeout-minutes: 10
      env:
        SYFT: ${{ steps.syft.outputs.cmd }}
        BASE_DIGEST: ${{ steps.digest.outputs.base }}
        NVIDIA_DIGEST: ${{ steps.digest.outputs.nvidia }}
      run: |
        # Only the RPM database is needed, so copy just that out of a container created from
        # the image (instant) instead of exporting or scanning the multi-GB image.
        for t in latest nvidia; do
          if [ "$t" = latest ]; then d="$BASE_DIGEST"; else d="$NVIDIA_DIGEST"; fi
          podman create --name "sbom-$t" "$IMAGE_REGISTRY/$IMAGE_NAME:$t" >/dev/null
          mkdir -p "rootfs-$t/usr/lib/sysimage" "rootfs-$t/etc"
          podman cp "sbom-$t:/usr/lib/sysimage/rpm" "rootfs-$t/usr/lib/sysimage/"
          # os-release tells syft the distro; without it grype cannot match any advisory
          podman cp "sbom-$t:/usr/lib/os-release" "rootfs-$t/usr/lib/os-release"
          ln -s ../usr/lib/os-release "rootfs-$t/etc/os-release"
          podman rm -f "sbom-$t" >/dev/null
          "$SYFT" "dir:rootfs-$t" -q --select-catalogers "rpm" \
            --source-name "$IMAGE_REGISTRY/$IMAGE_NAME" --source-version "$d" \
            -o "spdx-json=sbom-$t.spdx.json"
          grep -q 'distro=' "sbom-$t.spdx.json" || { echo "::error::SBOM for $t has no distro"; exit 1; }
        done

    - name: Install grype
      id: grype
      if: steps.sbom.outcome == 'success'
      continue-on-error: true
      uses: anchore/scan-action/download-grype@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7.4.0

    # Informational: list fixable vulnerabilities in the run summary, never blocks the build
    - name: List known vulnerabilities
      id: vulns
      if: steps.grype.outcome == 'success'
      continue-on-error: true
      timeout-minutes: 5
      env:
        GRYPE: ${{ steps.grype.outputs.cmd }}
      run: |
        for t in latest nvidia; do
          "$GRYPE" "sbom:sbom-$t.spdx.json" -q --only-fixed -o table > "vulns-$t.txt" || true
          {
            echo "### Fixable vulnerabilities in :$t"
            echo '```'
            cat "vulns-$t.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
        done

    - name: Attach SBOMs
      id: attach
      if: steps.sbom.outcome == 'success'
      continue-on-error: true
      timeout-minutes: 5
      env:
        COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
        COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        BASE_DIGEST: ${{ steps.digest.outputs.base }}
        NVIDIA_DIGEST: ${{ steps.digest.outputs.nvidia }}
      run: |
        # --tlog-upload=false: a full SBOM is far larger than Rekor accepts. The attestation is
        # still signed with our key; verify with --insecure-ignore-tlog.
        cosign attest --yes --tlog-upload=false --key env://COSIGN_PRIVATE_KEY --type spdxjson \
          --predicate sbom-latest.spdx.json "$IMAGE_REGISTRY/$IMAGE_NAME@$BASE_DIGEST"
        cosign attest --yes --tlog-upload=false --key env://COSIGN_PRIVATE_KEY --type spdxjson \
          --predicate sbom-nvidia.spdx.json "$IMAGE_REGISTRY/$IMAGE_NAME@$NVIDIA_DIGEST"

    - name: Attest build provenance (base)
      id: prov-base
      continue-on-error: true
      uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
      with:
        subject-name: ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}
        subject-digest: ${{ steps.digest.outputs.base }}

    - name: Attest build provenance (NVIDIA)
      id: prov-nvidia
      continue-on-error: true
      uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
      with:
        subject-name: ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}
        subject-digest: ${{ steps.digest.outputs.nvidia }}

    # continue-on-error reports a failed optional step as green; fail the run loudly instead,
    # after everything that matters (push, sign) is already done.
    - name: Fail if an optional supply chain step failed
      if: always()
      env:
        SYFT_OUTCOME: ${{ steps.syft.outcome }}
        SBOM_OUTCOME: ${{ steps.sbom.outcome }}
        ATTACH_OUTCOME: ${{ steps.attach.outcome }}
        PROV_BASE_OUTCOME: ${{ steps.prov-base.outcome }}
        PROV_NVIDIA_OUTCOME: ${{ steps.prov-nvidia.outcome }}
        GRYPE_OUTCOME: ${{ steps.grype.outcome }}
        VULNS_OUTCOME: ${{ steps.vulns.outcome }}
      run: |
        rc=0
        for v in SYFT SBOM GRYPE VULNS ATTACH PROV_BASE PROV_NVIDIA; do
          o="${v}_OUTCOME"
          if [ "${!o}" = failure ]; then echo "::error::supply chain step $v failed"; rc=1; fi
        done
        exit $rc
