name: Test rEFInd updater

on:
  pull_request:
    paths:
      - 'build-ctx/refind-updater*.go'
      - '.github/workflows/test-updater.yml'
  push:
    branches:
      - 'main'
    paths:
      - 'build-ctx/refind-updater*.go'
      - '.github/workflows/test-updater.yml'

permissions: {}

jobs:
  go-test:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        persist-credentials: false
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: '1.26'
    - run: go vet build-ctx/refind-updater.go build-ctx/refind-updater_test.go
    - run: go test -count=1 -race build-ctx/refind-updater.go build-ctx/refind-updater_test.go
