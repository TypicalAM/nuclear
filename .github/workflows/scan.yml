name: Scan image
run-name: Scan published image for known CVEs

on:
  # Manual only: grype's own cataloging of the multi-GB image takes 20+ minutes. The build now
  # lists fixable vulnerabilities from the RPM SBOM in its run summary.
  workflow_dispatch:

permissions: {}

jobs:
  grype:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
    - name: Registry login
      env:
        REGISTRY_USERNAME: ${{ secrets.REGISTRY_USER }}
        REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASS }}
      run: |
        mkdir -p ~/.docker
        echo "$REGISTRY_PASSWORD" | podman login docker.piaseczny.dev \
          --username "$REGISTRY_USERNAME" --password-stdin --authfile ~/.docker/config.json

    - name: Scan latest image
      uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
      with:
        image: docker.piaseczny.dev/machine/nuclear:latest
        fail-build: true
        severity-cutoff: critical
        only-fixed: true
